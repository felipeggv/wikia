<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protected article</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#0d0e11; --panel:#16181d; --panel2:#1d2027; --line:#2a2e36;
  --ink:#f2ede5; --txt:#d9d3c9; --muted:#9b968d; --dim:#666159;
  --ivory:#efe8dc; --wine:#b3264a; --gold:#d9a441;
  --f1:#5b8def; --f2:#e0a537; --f3:#3fb68b; --f4:#d8445e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --b:var(--ivory); --t:var(--wine);
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);scroll-behavior:smooth}
body{font-family:var(--sans);color:var(--txt);-webkit-font-smoothing:antialiased;font-size:16px;line-height:1.55;padding-bottom:60px}
a{color:var(--gold);text-decoration:none}
b,strong{color:var(--ink);font-weight:600}
.eu-cima{--b:var(--wine);--t:var(--ivory)}

/* topo + menu */
.top{position:sticky;top:0;z-index:10;background:rgba(13,14,17,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:12px 16px 6px;max-width:960px;margin:0 auto}
.brand .dot{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--wine),#5a1227);display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--ivory);font-size:15px}
.brand b{font-family:var(--serif);font-weight:400;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.brand span{display:none}}
.brand span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:auto}
nav{display:flex;gap:6px;overflow-x:auto;padding:6px 16px 10px;max-width:960px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
nav a.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{max-width:960px;margin:0 auto;padding:18px 16px}
section{display:none}
section.on{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

.kicker{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:6px 0 8px}
h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:40px;line-height:1.02;letter-spacing:-.01em}
h2{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:30px;line-height:1.1;margin:4px 0 14px}
h3{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:22px;line-height:1.15;margin:26px 0 10px}
h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
p{margin:0 0 12px}
.lead{font-size:18px;color:var(--txt)}
.muted{color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin:12px 0}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr}
.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin:2px 4px 2px 0;vertical-align:middle}
.tag.ja{border-color:var(--f3);color:var(--f3)}
.tag.gi{border-color:#6d7fa8;color:#9fb0d6}
.tag.nogi{border-color:#a86d7f;color:#d69fb0}
ol.steps{counter-reset:s;list-style:none;margin:8px 0}
ol.steps li{counter-increment:s;position:relative;padding:8px 0 8px 40px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
ol.steps li::before{content:counter(s);position:absolute;left:0;top:7px;width:27px;height:27px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
ul.dots{list-style:none}
ul.dots li{padding:6px 0 6px 20px;position:relative}
ul.dots li::before{content:"";position:absolute;left:4px;top:15px;width:6px;height:6px;border-radius:99px;background:var(--gold)}
.box{border-radius:12px;padding:12px 14px;margin:10px 0;font-size:15px;border-left:4px solid var(--c,var(--gold));background:var(--panel2)}
.box b.l{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--c,var(--gold));margin-bottom:2px}
.k{--c:var(--f3)} .e{--c:var(--f4)} .l{--c:var(--f2)} .p{--c:var(--f1)}
table{width:100%;border-collapse:collapse;font-size:14.5px;margin:10px 0}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--ink)}
pre{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;line-height:1.5;background:#0a0b0d;border:1px solid var(--line);border-radius:12px;padding:12px;overflow-x:auto;color:#cfc9bf;margin:10px 0}
svg.ic{display:block;flex:none}

/* home */
.hero{background:radial-gradient(700px 400px at 90% 120%,#3a0f1d 0%,transparent 60%),radial-gradient(600px 300px at 0 0,#1d2433,transparent 60%),var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 18px}
.hero .strip{display:flex;gap:8px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.hero .strip svg{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;flex:none}
.hoje{border-color:var(--gold);background:linear-gradient(180deg,rgba(217,164,65,.08),transparent),var(--panel)}
.hoje .d{font-family:var(--serif);font-size:28px;color:var(--ink);line-height:1.1}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:block;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;color:var(--txt)}
.tile b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;margin-bottom:2px}
.tile span{font-size:13px;color:var(--muted);line-height:1.35;display:block}

/* fases */
.phase{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:14px;background:var(--panel);border:1px solid var(--line);margin:10px 0;border-left:5px solid var(--c)}
.phase .n{font-family:var(--serif);font-size:40px;line-height:.9;color:var(--c);min-width:30px}
.phase h3{margin:0 0 4px;font-size:21px}
.phase p{font-size:15px;margin:0}

/* linha do tempo da aula */
.tl{position:relative;margin:10px 0 0 6px;border-left:2px solid var(--line);padding-left:18px}
.blk{position:relative;margin:0 0 14px}
.blk::before{content:"";position:absolute;left:-26px;top:6px;width:14px;height:14px;border-radius:99px;background:var(--c);border:3px solid var(--bg)}
.blk .hd{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.blk .hd b{font-family:var(--serif);font-weight:400;font-size:20px}
.blk .min{font-size:12px;color:var(--muted);letter-spacing:.06em}
.blk .body{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:6px;font-size:15px}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.toggle button{background:none;border:0;color:var(--muted);font:inherit;font-size:13px;padding:6px 14px;cursor:pointer}
.toggle button.on{background:var(--ink);color:var(--bg)}

/* calendário */
.week{background:var(--panel);border:1px solid var(--line);border-radius:16px;margin:14px 0;overflow:hidden}
.week .wh{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.week .wh .t span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.week .wh .t b{display:block;font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.1}
.week .wh .t em{font-style:normal;font-size:13px;color:var(--muted)}
.day{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.day:last-child{border-bottom:0}
.day .dd{border-radius:10px;background:var(--c);color:#0d0e11;text-align:center;padding:6px 2px;height:max-content}
.day .dd b{display:block;color:#0d0e11;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.day .dd span{font-size:17px;font-weight:700}
.day .dd i{display:block;font-style:normal;font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.7}
.day .dt b{font-size:15.5px}
.day .dt p{font-size:14px;margin:4px 0 6px;color:var(--muted)}
.chip{display:inline-block;font-size:12.5px;padding:4px 10px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);color:var(--ink);margin:3px 4px 0 0}
.chip:active{background:var(--line)}
.day.past{opacity:.45}
.day.next{background:rgba(217,164,65,.07)}
.cyc{display:grid;grid-template-columns:1fr;gap:10px}
.cy{border-radius:14px;padding:14px;background:var(--panel);border:1px solid var(--line);border-top:4px solid var(--c)}
.cy .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.cy .h b{font-family:var(--serif);font-weight:400;font-size:21px}
.cy .h span{font-size:12px;color:var(--muted);white-space:nowrap}
.cy ol{margin:8px 0 0 18px;font-size:14.5px}
.cy ol li{padding:2px 0}
.warn{font-size:12.5px;color:var(--gold)}

/* fundamentos */
.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:8px 0 10px;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;font:inherit;font-size:13px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--muted);cursor:pointer}
.filters button.on{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:#0d0e11}
.search{width:100%;font:inherit;font-size:16px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
.search:focus{border-color:var(--gold)}
details.tech{background:var(--panel);border:1px solid var(--line);border-radius:14px;margin:10px 0;border-left:4px solid var(--c)}
details.tech[open]{border-color:var(--c)}
details.tech summary{list-style:none;display:flex;gap:12px;align-items:center;padding:12px;cursor:pointer}
details.tech summary::-webkit-details-marker{display:none}
details.tech summary .nm{flex:1;min-width:0}
details.tech summary .nm b{display:block;font-size:16px;line-height:1.25}
details.tech summary .nm .c{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
details.tech summary .ar{color:var(--dim);transition:transform .2s;font-size:18px}
details.tech[open] summary .ar{transform:rotate(90deg)}
details.tech .in{padding:0 14px 14px}
details.tech .in .obj{font-size:15px;color:var(--txt);margin-bottom:4px}
.adj{margin-top:10px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted)}
.cnt{font-size:13px;color:var(--muted);margin:4px 0}

/* controle */
.tags8{display:grid;grid-template-columns:1fr;gap:8px}
.tg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tg b{font-size:15px}
.tg code{float:right}
.tg p{font-size:13.5px;color:var(--muted);margin:2px 0 0}
.metric{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.metric div{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.metric b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;color:var(--gold);line-height:1}
.metric span{font-size:13px;color:var(--muted)}

@media (min-width:760px){
  h1{font-size:60px} h2{font-size:38px}
  .g2,.tags8,.cyc{grid-template-columns:1fr 1fr}
  .tiles{grid-template-columns:repeat(3,1fr)}
  .metric{grid-template-columns:repeat(4,1fr)}
  .hero{padding:36px 32px}
}
</style>
<style>
:root{--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--bg-sidebar:#16181d;--border:#2a2e36;--accent-dim:rgba(217,164,65,.12);--text-dim:#9b968d;--font:var(--sans);--text-main:#f2ede5;--bg-main:#0d0e11;--accent:#d9a441;--accent-text:#0d0e11;--error:#d8445e}
#ap-gate{min-height:80vh}
</style>
</head>

      <form id="ap-gate-form">
        <label for="ap-gate-input">senha</label>
        <input type="password" id="ap-gate-input" autocomplete="off" autofocus spellcheck="false">
        <button type="submit">› DESTRAVAR WIKI</button>
        <div class="ap-gate-err" id="ap-gate-err"></div>
      </form>
      <div class="ap-gate-footnote">
        <div class="prompt">wikia · aes-256-gcm · pbkdf2 100k</div>
        Sua senha fica persistente neste browser (localStorage). Limpe os dados do site pra deslogar.
      </div>
    </div>
  </div>

  <div id="ap-content-mount" style="display:none"></div>
</div>

<style>

  .ap-gate-card { background: var(--bg-sidebar); border: 1px solid var(--border); border-radius: 8px; padding: var(--s-7) var(--s-6); max-width: 420px; width: 100%; box-shadow: 0 24px 60px rgba(0,0,0,0.4); }
  .ap-gate-badge { display:inline-block; padding: 3px 10px; background: var(--accent-dim); color: var(--text-dim); font-size: 10px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; border: 1px solid var(--border); border-radius: 999px; margin-bottom: var(--s-4); font-family: var(--font); }
  .ap-gate-title { font-family: var(--font); font-weight: 600; font-size: 1.5em; color: var(--text-main); margin: 0 0 var(--s-2); line-height: 1.3; }
  .ap-gate-lead { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--s-5); line-height: 1.6; }
  .ap-gate-card label { display:block; color: var(--text-dim); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; font-family: var(--font); }
  #ap-gate-input { width:100%; padding: 10px 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; color: var(--text-main); font: inherit; font-size: 14px; outline: none; transition: border-color 0.15s; }
  #ap-gate-input:focus { border-color: var(--accent); }
  .ap-gate-card button { width:100%; margin-top: var(--s-3); padding: 10px; background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; letter-spacing: 0.06em; font-family: var(--font); transition: background 0.15s; font-size: 12px; }
  .ap-gate-card button:hover { background: #6d796d; }
  .ap-gate-err { color: var(--error); font-size: 12px; margin-top: var(--s-3); min-height: 1.2em; }
  .ap-gate-footnote { margin-top: var(--s-5); padding-top: var(--s-4); border-top: 1px solid var(--border); color: var(--text-dim); font-size: 10px; line-height: 1.6; }
  .ap-gate-footnote .prompt::before { content: "$ "; color: var(--accent); }
</style>

  const SALT_B64 = "torTz68IwKO/Ez5vyXi6sg==";
  const IV_B64 = "0BE00I6rOt0S76YX";
  // KEY de localStorage é POR BU — senha de uma BU não destrava outra (isolamento multi-tenant).
  // gobbi é injetado pelo render-artifact ao gerar o HTML. Default cai em "wiki" pra páginas
  // que ainda não passam BU explícita (compat). Para gate de artefato, sempre tem BU.
  const STORAGE_KEY = "wikia-master-key-gobbi";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }

  async function deriveKey(pwd, salt) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }

  async function tryUnlock(pwd) {
    try {
      const salt = b64(SALT_B64), iv = b64(IV_B64), cipher = b64(ENCRYPTED_PAYLOAD);
      const key = await deriveKey(pwd, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      const decrypted = new TextDecoder().decode(plain);
      mount.innerHTML = decrypted;
      mount.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      // localStorage — persiste cross-page e cross-session
      localStorage.setItem(STORAGE_KEY, pwd);
      // Notifica componentes (mermaid-zoom, comparator, accordion-seq) que conteúdo
      // criptografado foi injetado no DOM e podem (re)inicializar.
      document.dispatchEvent(new CustomEvent('wikia:unlocked', { detail: { html: decrypted } }));
      return true;
    } catch (e) { return false; }
  }

  // Auto-unlock: se já tem chave salva no localStorage, tenta
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    tryUnlock(saved).then(ok => { if (!ok) localStorage.removeItem(STORAGE_KEY); });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) { err.textContent = '✗ senha incorreta'; input.value = ''; input.focus(); }
  });
})();
