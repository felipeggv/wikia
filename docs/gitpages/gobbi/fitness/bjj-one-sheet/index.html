<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protected article</title>
<meta name="robots" content="noindex,nofollow">
<style>
@page{size:A4 landscape;margin:0}
:root{
  --paper:#fbf8f2; --ink:#1b1d22; --txt:#3b3e45; --muted:#7c776d; --line:#e0d9cb;
  --wine:#a3213f; --gold:#a97a22; --ok:#2f8f5b;
  --ter:#3566c9; --ter-bg:#e9effb;
  --qui:#b9790f; --qui-bg:#fbf0d9;
  --sex:#c2334f; --sex-bg:#fbe5e9;
  --pro-bg:#f3ecd9;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
  --b:var(--ink); --t:var(--wine);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
html{background:#e7e2d7}
body{font-family:var(--sans);color:var(--txt);font-size:11.5px;line-height:1.4;-webkit-font-smoothing:antialiased}
b,strong{color:var(--ink);font-weight:650}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
.eu-cima{--b:var(--wine);--t:var(--ink)}
.view[hidden]{display:none!important}

/* barra do app */
.bar{position:sticky;top:0;z-index:20;background:rgba(251,248,242,.95);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{display:flex;align-items:center;gap:10px;max-width:1180px;margin:0 auto;padding:10px 14px 4px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;min-width:0}
.logo .dot{width:26px;height:26px;border-radius:7px;background:var(--wine);color:#fff;font-family:var(--serif);font-size:15px;display:flex;align-items:center;justify-content:center;flex:none}
.logo b{font-family:var(--serif);font-weight:400;font-size:17px;white-space:nowrap}
.prog{font-size:12px;color:var(--muted);white-space:nowrap}
.sync{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 11px;font-size:12px;white-space:nowrap;max-width:52vw;overflow:hidden;text-overflow:ellipsis}
.sync.ok{border-color:#bfe0cc;color:var(--ok)}
.sync.warn{border-color:#ecc9a0;color:#9a5b12}
.sync.bad{border-color:#efb6c2;color:var(--sex)}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1180px;margin:0 auto;padding:6px 14px 9px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);background:#fff;text-decoration:none;color:var(--muted);white-space:nowrap}
.tabs a.on{background:var(--ink);border-color:var(--ink);color:#fff}

/* a folha */
#v-cal{padding:18px 0 40px}
.sheet{width:min(1260px,calc(100% - 40px));margin:0 auto;background:var(--paper);padding:26px 30px 24px;display:flex;flex-direction:column;gap:14px;border-radius:6px;box-shadow:0 1px 2px rgba(60,48,30,.06),0 14px 44px rgba(60,48,30,.11)}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;border-bottom:2px solid var(--ink);padding-bottom:9px}
.kicker{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);font-weight:700}
h1{font-family:var(--serif);font-weight:400;color:var(--ink);font-size:31px;line-height:1.05;margin-top:3px}
.meta{text-align:right;font-size:11px;color:var(--muted);line-height:1.5}
.meta b{font-size:13px}
.pbar{height:7px;border-radius:9px;background:#ece6da;overflow:hidden;margin:6px 0 4px;min-width:220px}
.pbar i{display:block;height:100%;background:var(--ok);border-radius:9px}
.acts{display:flex;gap:6px;justify-content:flex-end;margin-top:6px}
.bot{display:grid;grid-template-columns:1.35fr 1fr 1fr;gap:12px;align-items:start}
.blk{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
h2{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px;white-space:nowrap}
h2 small{font-size:9px;letter-spacing:.04em;text-transform:none;font-weight:400}
.rules ol{list-style:none;counter-reset:r}
.rules li{counter-increment:r;position:relative;padding:0 0 8px 30px}
.rules li:last-child{padding-bottom:0}
.rules li::before{content:counter(r);position:absolute;left:0;top:-4px;font-family:var(--serif);font-size:26px;color:var(--wine);line-height:1}
.rules li b{display:block;font-size:12.5px}
.bar4{display:flex;height:22px;border-radius:5px;overflow:hidden;margin-bottom:9px}
.bar4 i{font-style:normal;font-size:10.5px;font-weight:700;color:#fff;display:flex;align-items:center;justify-content:center}
.b1{background:#c9c1b0} .b2{background:#5f6878} .b3{background:var(--wine)} .b4{background:#5a1227}
.bar4 .b1{color:var(--ink)}
.steps{display:grid;grid-template-columns:10px 1fr auto;gap:5px 8px;align-items:start}
.steps .sw{width:10px;height:10px;border-radius:3px;margin-top:3px}
.steps .min{font-size:10.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
.steps .cap{font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.steps b{font-size:12px}
.deal{display:grid;grid-template-columns:1.25fr 1fr auto;gap:22px;align-items:center;padding:8px 14px}
.deal h3{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--wine);font-weight:700;margin-bottom:2px}
.deal ul{list-style:none;display:flex;flex-wrap:wrap;gap:1px 16px}
.deal li{position:relative;padding-left:11px;color:var(--ink)}
.deal li::before{content:"";position:absolute;left:0;top:6px;width:5px;height:5px;border-radius:9px;background:var(--wine)}
.deal .sig{font-family:var(--serif);font-size:15px;color:var(--ink);line-height:1.2;border-left:2px solid var(--wine);padding-left:14px}

.cal{display:grid;grid-template-columns:minmax(150px,176px) repeat(7,minmax(0,1fr))}
.corner{display:flex;align-items:flex-end;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:0 0 9px;border-bottom:1.5px solid var(--ink)}
.ter{--c:var(--ter);--bg:var(--ter-bg)} .qui{--c:var(--qui);--bg:var(--qui-bg)} .sex{--c:var(--sex);--bg:var(--sex-bg)} .pro{--c:var(--gold);--bg:var(--pro-bg)}
.ch{display:flex;flex-direction:column;gap:2px;min-width:0;padding:0 8px 9px;border-bottom:1.5px solid var(--ink);border-left:1px solid transparent}
.ch b{font-size:12.5px;font-weight:650;color:var(--ink);letter-spacing:.01em}
.ch span{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch.jj span{color:var(--txt);font-weight:550}
.wl{display:flex;gap:9px;align-items:flex-start;min-width:0;padding:12px 12px 12px 0;border-bottom:1px solid var(--line)}
.wl svg{flex:none;margin-top:1px}
.wl .k{display:block;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine);font-weight:700}
.wl b{display:block;font-family:var(--serif);font-weight:400;font-size:16px;line-height:1.12;color:var(--ink);margin-top:3px;text-wrap:balance}
.wl em{display:block;font-style:normal;font-size:11px;color:var(--muted);margin-top:3px}
.wl .ws{font-size:11px;font-weight:600;color:var(--ok);margin-top:6px}
.wl .ws.err{color:var(--sex)}
.dc{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0;min-height:108px;padding:8px 7px 10px;border-bottom:1px solid var(--line);border-left:1px solid var(--line)}
.dc.dom{background:rgba(124,119,109,.055)}
.dn{display:flex;align-items:baseline;gap:5px;font-size:11px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.1}
.dn .wd{display:none}
.dc.today .dn .d{color:#fff;background:var(--ink);border-radius:99px;padding:3px 7px;margin:-3px 0 -2px -4px}
.di{display:flex;flex-direction:column;gap:6px;min-width:0}
.dc.past .fz,.dc.past .nt{opacity:.5}
.fz{align-self:flex-start;display:inline-flex;align-items:center;gap:5px;font-size:10px;font-weight:700;letter-spacing:.09em;color:var(--txt);background:#ebe5d8;border-radius:4px;padding:4px 7px 4px 6px;line-height:1}
.fz::before{content:"";width:5px;height:5px;border-radius:2px;background:#8b8478}
.fz em{font-style:normal;letter-spacing:0;font-weight:650;color:var(--wine)}
.nt{display:flex;align-items:center;gap:5px;font-size:10.5px;line-height:1.3;color:var(--muted)}
.nt svg{width:12px;height:12px;flex:none}
.fer{border-radius:6px;padding:7px 8px;font-size:10.5px;line-height:1.3;color:var(--muted);background:repeating-linear-gradient(-45deg,rgba(124,119,109,.10) 0 5px,rgba(124,119,109,.03) 5px 10px)}
.fer b{display:block;font-size:11.5px;font-weight:650;color:var(--ink)}
.band{position:relative;z-index:1;align-self:stretch;margin:30px 7px 10px;border-radius:7px;padding:9px 12px;display:flex;flex-direction:column;justify-content:center;gap:3px;background:repeating-linear-gradient(-45deg,rgba(124,119,109,.11) 0 6px,rgba(124,119,109,.04) 6px 12px),#f2ede3;border:1px solid #e2dacb}
.band b{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:650;color:var(--ink)}
.band b svg{width:16px;height:14px;flex:none}
.band span{font-size:11px;color:var(--muted);line-height:1.35}
.band .dr{display:none}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;font-size:11px;color:var(--muted)}
.leg i{display:inline-block;width:9px;height:9px;border-radius:2px;background:var(--c);margin-right:6px;vertical-align:0}
.leg b{font-size:10px;letter-spacing:.09em;color:var(--txt);background:#ebe5d8;border-radius:4px;padding:2px 6px;margin-right:6px}
.leg em{font-style:normal;font-weight:650;color:var(--wine);margin-right:4px}
.comb .cb{display:grid;grid-template-columns:18px 1fr;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);cursor:pointer}
.comb .cb:last-child{border-bottom:0}
.comb .cb input{width:16px;height:16px;accent-color:var(--ok);margin-top:1px}
.comb .cb b{font-size:11.5px} .comb .cb span{display:block;font-size:10.6px;color:var(--muted);line-height:1.35}
.comb .cb:has(input:checked) b{color:var(--ok)}
.c{position:relative;display:block;background:var(--bg);border-radius:6px;border-left:3px solid var(--c);padding:6px 8px 8px;cursor:pointer;outline:none;transition:transform .16s ease,box-shadow .16s ease}
.c:hover{transform:translateY(-1px);box-shadow:0 5px 14px rgba(60,48,30,.13)}
.c:active{transform:scale(.985)}
.c:focus-visible{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c)}
.c .rl{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--c);padding-right:22px;line-height:1.35}
.c b{display:block;font-size:12px;font-weight:600;line-height:1.25;color:var(--ink);margin-top:2px;text-wrap:balance}
.c p{display:none}
.c .bd{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.c .bd span{font-size:9.5px;font-weight:650;color:var(--txt);background:rgba(255,255,255,.75);border-radius:3px;padding:1px 5px;line-height:1.5}
.c .bd span.x{color:var(--wine)}
.c.today{box-shadow:0 0 0 2px var(--ink)}
.ck{position:absolute;top:5px;right:5px;width:18px;height:18px;border-radius:99px;border:1.5px solid var(--c);background:#fff;padding:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;line-height:1;color:#fff;transition:transform .12s ease}
.ck:hover{transform:scale(1.12)}
.c.done .ck{background:var(--ok);border-color:var(--ok)}
.c.done .ck::after{content:"✓"}
.c.falta .ck{border-color:var(--sex);color:var(--sex)}
.c.falta .ck::after{content:"×"}
.c.pend .ck{border-style:dashed}
.c.done{background:linear-gradient(0deg,rgba(47,143,91,.08),rgba(47,143,91,.08)),var(--bg)}
.mt{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mt span{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:650;padding:1px 6px;border-radius:99px;background:rgba(255,255,255,.75);color:var(--txt)}
.mt span.ok{color:var(--ok)} .mt span.no{color:var(--sex)}
.mt svg{width:10px;height:10px}
.ft{display:flex;justify-content:space-between;gap:18px;align-items:center;border-top:1px solid var(--line);padding-top:7px;font-size:10.3px;color:var(--muted)}
.lg{display:inline-block;width:9px;height:9px;border-radius:9px;vertical-align:-1px;margin:0 3px 0 6px}

/* botões e campos */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 12px;font-size:14px;text-decoration:none;color:var(--ink);font-weight:600}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.rec{background:var(--sex);border-color:var(--sex);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:default}
input[type=text],input[type=url],input[type=password],textarea,select{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:#fff;color:var(--ink);outline:none}
textarea{min-height:76px;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}

/* telas */
.pane{max-width:760px;margin:0 auto;padding:14px 14px 110px;font-size:15px;line-height:1.5}
.topnav{display:flex;align-items:center;gap:10px;margin:2px 0 10px;font-size:14px}
.topnav a{text-decoration:none;color:var(--muted)}
.topnav .n{margin-left:auto;color:var(--muted);font-size:13px}
.hero{border-radius:16px;padding:16px 16px 14px;background:var(--c);color:#fff;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.hero.pro{--c:var(--gold)} .hero.off{--c:#8a8476}
.hero .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.9}
.hero h1{color:#fff;font-size:28px;margin:4px 0 2px}
.hero .sub{font-size:14px;opacity:.92}
.hero .dt{text-align:center;background:rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;min-width:62px}
.hero .dt b{display:block;color:#fff;font-size:26px;line-height:1;font-family:var(--serif);font-weight:400}
.hero .dt span{font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.hero .fig{grid-column:1/-1;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.92);border-radius:12px;padding:6px 10px;color:var(--ink);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;margin:12px 0}
.seg button{border:0;background:none;padding:11px 4px;font-size:14px;font-weight:650;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:#fff}
.seg button.on.v{background:var(--ok)}
.seg button.on.x{background:var(--sex)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.card>h2{font-size:11px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-block;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 11px;font-size:13.5px;text-decoration:none;color:var(--ink);line-height:1.25}
a.chip::after{content:" ↗";color:var(--muted)}
.chip.on{background:var(--wine);border-color:var(--wine);color:#fff}
.missao{margin-top:12px;border-left:3px solid var(--wine);background:var(--paper);border-radius:0 10px 10px 0;padding:9px 12px;font-size:14.5px}
.missao b{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--wine)}
.cad{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.cad.on{border-left:3px solid var(--wine);padding-left:10px}
.cad .hint{margin:-2px 0 6px}
.nv{list-style:none;display:grid;gap:3px;margin:0 0 10px;font-size:14px}
.nv li{display:grid;grid-template-columns:28px 1fr;gap:6px}
.nv b{font-size:11px;letter-spacing:.06em;color:var(--wine);padding-top:2px}
.cad .row{margin-bottom:8px}
.cad textarea{min-height:64px}
.cad .dl{margin-bottom:10px}
.dl .nv{margin:0}
.dl .nv li{padding:0}
.dl .nv li::before{display:none}
.ontem p{margin:0 0 6px}
.ontem .se span{white-space:pre-wrap}
details.mais>summary{cursor:pointer;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.mais h3{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin:18px 0 8px}
#tmr{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--c);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -8px 30px rgba(0,0,0,.22)}
#tmr[hidden]{display:none}
#tmr.prep{--c:var(--gold)} #tmr.work{--c:var(--wine)} #tmr.rest{--c:var(--ok)}
#tmr .pb{position:absolute;top:0;left:0;height:4px;background:rgba(255,255,255,.7)}
#tmr .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:1fr auto;gap:2px 14px;align-items:center}
#tmr .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;opacity:.85}
#tmr .ph{font-family:var(--serif);font-size:24px;line-height:1.15}
#tmr .cl{grid-row:1/3;grid-column:2;font-family:var(--serif);font-size:54px;line-height:1;font-variant-numeric:tabular-nums}
#tmr .lv{grid-column:1/-1;font-size:14px;margin-top:2px}
#tmr .bt{grid-column:1/-1;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;margin-top:10px}
#tmr .bt button{border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;padding:10px 2px;font-size:14px;font-weight:650}
body.tm .pane{padding-bottom:240px}
.tempo{display:flex;gap:8px;align-items:center;margin-top:12px}
.tempo input{max-width:120px}
.it{border-left:3px solid var(--line);padding:8px 10px;margin:10px 0;background:var(--paper);border-radius:0 10px 10px 0;overflow-wrap:anywhere}
.it.fb{border-color:var(--ter);background:var(--ter-bg)}
.it.an{border-color:var(--gold)}
.ih{display:flex;align-items:center;gap:8px}
.ih .kd{font-size:11px;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.it.fb .kd{color:var(--ter)}
.ih b{font-size:14.5px;font-weight:600}
.ih .x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;padding:0 4px}
.it p{margin:4px 0 0;white-space:pre-wrap}
.it .when{font-size:12px;color:var(--muted);margin-top:4px}
.it audio,.it video,.it img{display:block;width:100%;margin-top:8px;border-radius:8px}
.it .slot{margin-top:6px}
.tr{margin-top:8px;font-size:14px;background:#fff;border-radius:8px;padding:8px 10px;white-space:pre-wrap}
.tr b{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.rd{display:grid;grid-template-columns:52px 1fr;gap:2px 10px;font-size:14px;margin-top:8px}
.rd span{color:var(--gold);font-variant-numeric:tabular-nums}
.compose{display:grid;gap:8px;margin-bottom:6px}
.compose .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.compose label{display:flex;align-items:center;gap:6px;font-size:14px}
.compose label input{width:18px;height:18px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.linkf{display:grid;gap:8px;margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px}
.pager{position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--paper) 70%,rgba(251,248,242,0))}
.pager a{display:block;text-decoration:none;background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:14px;font-weight:650;color:var(--ink);min-height:54px}
.pager a small{display:block;font-size:12px;font-weight:400;color:var(--muted)}
.pager a.nx{text-align:right}
.pager a.dis{visibility:hidden}
.vazio{font-size:14px;color:var(--muted);border:1px dashed var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
ol.how{margin:6px 0 0 20px}
ol.how li{padding:3px 0}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
.jt{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.jt b{font-size:15px} .jt span{font-size:12.5px;color:var(--muted);white-space:nowrap}
.dl{display:grid;grid-template-columns:66px 1fr;gap:6px 10px;font-size:14.5px}
.dl dt{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);padding-top:3px}
.dl dt.ok{color:var(--ok)} .dl dt.x{color:var(--sex)}
.dl ul{list-style:none} .dl li{position:relative;padding:0 0 3px 12px} .dl li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:9px;background:var(--wine)}
.se{display:grid;grid-template-columns:1fr;gap:1px;padding:8px 10px;margin-top:6px;background:var(--paper);border-radius:10px;font-size:14px}
.se b{font-size:14px}
.fmt{margin-top:10px;font-size:14px;font-weight:600;color:var(--ink);border-left:3px solid var(--ink);padding:2px 0 2px 10px}
details.rg{margin-top:12px;font-size:14px}
details.rg summary{cursor:pointer;color:var(--muted);font-weight:600}
details.rg ol{margin:8px 0 0 20px} details.rg li{padding:2px 0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:14px;padding:9px 14px;border-radius:12px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}

@media screen and (max-width:900px){
  html{background:var(--paper)}
  body{font-size:14px}
  #v-cal{padding:0 0 30px}
  .sheet{display:block;width:auto;min-height:0;padding:16px 14px 24px;box-shadow:none}
  .hd{display:block;margin-bottom:14px}
  h1{font-size:30px}
  .meta{text-align:left;margin-top:8px;font-size:12.5px}
  .meta b{font-size:14px}
  .pbar{min-width:0}
  .acts{display:none}
  .bot{display:flex;flex-direction:column;gap:14px}
  .blk{padding:14px}
  h2{font-size:11px}
  .rules li{padding-bottom:10px}
  .rules li b{font-size:15px}
  .steps b{font-size:14px}
  .steps .min{font-size:12px}
  .deal{display:block;margin-top:14px;padding:14px}
  .deal h3{font-size:11px;margin:0 0 4px}
  .deal ul{display:block;margin-bottom:12px}
  .deal li{padding:2px 0 2px 13px}
  .deal li::before{top:9px}
  .deal .sig{font-size:17px}
  .cal{display:block}
  .corner,.ch{display:none}
  .leg{font-size:12px;gap:8px 14px}
  .wl{padding:20px 0 9px;border-bottom:2px solid var(--ink)}
  .wl b{font-size:20px}
  .wl em,.wl .ws{font-size:12.5px}
  .dc{flex-direction:row;align-items:flex-start;gap:12px;min-height:0;padding:10px 0;border-left:0}
  .dc.livre:not(.today){display:none}
  .dc.dom{background:none}
  .dn{flex:none;width:44px;flex-direction:column;align-items:flex-start;gap:3px;font-size:14px;color:var(--ink)}
  .dn .wd{display:block;font-size:11.5px;font-weight:500;color:var(--muted)}
  .dc.today .dn .d{margin:-3px 0 0 -5px}
  .dc.livre.today .di::after{content:"dia livre";font-size:13px;color:var(--muted)}
  .di{flex:1;gap:7px}
  .fz{font-size:11px;padding:5px 9px 5px 8px}
  .nt{font-size:12.5px}
  .fer{font-size:12.5px;padding:9px 11px} .fer b{font-size:14px}
  .band{margin:12px 0 2px;padding:12px 14px}
  .band .dr{display:block;font-size:12px;font-weight:650;color:var(--txt)}
  .band b{font-size:15px} .band span{font-size:12.5px}
  .c{padding:9px 12px 11px}
  .c .rl{font-size:10.5px;padding-right:42px}
  .c b{font-size:15px}
  .c p{display:block;font-size:13px;line-height:1.4;color:var(--txt);margin-top:3px}
  .c .bd span{font-size:11px}
  .ck{width:32px;height:32px;top:7px;right:7px;font-size:16px}
  .ck::before{content:"";position:absolute;inset:-8px}
  .comb h2,.blk h2{white-space:normal;flex-wrap:wrap}
  html,body{overflow-x:hidden}
  .comb .cb b{font-size:14.5px} .comb .cb span{font-size:13px}
  .comb .cb input{width:20px;height:20px}
  .comb .cb{grid-template-columns:24px 1fr;padding:9px 0}
  .prog{display:none}
  .ft{display:block;margin-top:18px;font-size:12px;line-height:1.7}
  .ft span{display:block}
}
@media print{
  html,body{background:none}
  .bar,#toast,#tmr,.view:not(#v-cal),.ck,.mt,.acts,.pbar,.wl .ws{display:none!important}
  #v-cal{display:block!important;padding:0}
  .sheet{width:297mm;box-shadow:none;margin:0;padding:7mm 8mm 5mm;border-radius:0;gap:10px}
  .hd{padding-bottom:6px} h1{font-size:26px}
  .dc{min-height:0;padding:4px 5px 5px;gap:3px}
  .dn{font-size:9.5px} .di{gap:3px}
  .ch{padding:0 6px 6px} .ch span{white-space:normal;font-size:9.5px} .corner{padding-bottom:6px}
  .wl{padding:6px 6px 6px 0;gap:6px} .wl svg{width:28px;height:24px} .wl b{font-size:13.5px} .wl em{font-size:9.5px}
  .fz{font-size:8.5px;padding:3px 5px}
  .c{padding:3px 5px 4px} .c .rl{font-size:8px;padding-right:0} .c b{font-size:10px;margin-top:1px}
  .c .bd{margin-top:2px;gap:2px} .c .bd span{font-size:8px;padding:0 4px}
  .nt,.fer{font-size:9px} .fer{padding:4px 6px} .fer b{font-size:10px}
  .band{margin:19px 5px 5px;padding:5px 8px} .band b{font-size:11px} .band span{font-size:9.5px}
  .leg{font-size:9.5px;gap:4px 14px}
  .dc.today .dn .d{background:none;color:var(--muted);padding:0;margin:0}
  .c.today{box-shadow:none}
  .c.done{background:var(--bg)}
  .bot{break-before:page}
}

  const SALT_B64 = "ajZJdwwT1Ex/l/0qViMvkA==";
  const IV_B64 = "8zhV5wzwg0xmb2ap";
  // KEY de localStorage é POR BU — senha de uma BU não destrava outra (isolamento multi-tenant).
  // gobbi é injetado pelo render-artifact ao gerar o HTML. Default cai em "wiki" pra páginas
  // que ainda não passam BU explícita (compat). Para gate de artefato, sempre tem BU.
  const STORAGE_KEY = "wikia-master-key-gobbi";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }

  async function deriveKey(pwd, salt) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }

  async function tryUnlock(pwd) {
    try {
      const salt = b64(SALT_B64), iv = b64(IV_B64), cipher = b64(ENCRYPTED_PAYLOAD);
      const key = await deriveKey(pwd, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      const decrypted = new TextDecoder().decode(plain);
      mount.innerHTML = decrypted;
      mount.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      // localStorage — persiste cross-page e cross-session
      localStorage.setItem(STORAGE_KEY, pwd);
      // Notifica componentes (mermaid-zoom, comparator, accordion-seq) que conteúdo
      // criptografado foi injetado no DOM e podem (re)inicializar.
      document.dispatchEvent(new CustomEvent('wikia:unlocked', { detail: { html: decrypted } }));
      return true;
    } catch (e) { return false; }
  }

  // Auto-unlock: se já tem chave salva no localStorage, tenta
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    tryUnlock(saved).then(ok => { if (!ok) localStorage.removeItem(STORAGE_KEY); });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) { err.textContent = '✗ senha incorreta'; input.value = ''; input.focus(); }
  });
})();
