<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Protected article</title>
<meta name="robots" content="noindex,nofollow">
<style>
:root{
  --bg:#0d0e11; --panel:#16181d; --panel2:#1c1f25; --line:#2a2e36;
  --ink:#f2ede5; --muted:#9b968d; --dim:#5f5b55;
  --you:#efe8dc; --opp:#b3264a; --gold:#d9a441;
  --f1:#5b8def; --f2:#e0a537; --f3:#3fb68b; --f4:#d8445e;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:#07080a}
body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;padding:24px 0}
.deck{zoom:var(--z,1);width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.slide{width:1280px;height:800px;background:var(--bg);position:relative;overflow:hidden;padding:52px 60px 64px;border-radius:14px}
.sf{position:absolute;left:60px;right:60px;bottom:26px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.kicker{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:12px}
h1{font-family:var(--serif);font-weight:400;font-size:112px;line-height:.95;letter-spacing:-.02em}
h2{font-family:var(--serif);font-weight:400;font-size:48px;line-height:1.05;letter-spacing:-.01em;margin-bottom:28px}
h3{font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1}
p,li{font-size:17px;line-height:1.5;color:#d9d3c9}
.muted{color:var(--muted)}
.tag{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.row{display:flex;gap:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px}
svg.sc{display:block}

/* capa */
.cover{background:radial-gradient(1200px 700px at 85% 110%,#3a0f1d 0%,transparent 60%),radial-gradient(900px 500px at -10% -20%,#1d2433 0%,transparent 60%),var(--bg)}
.cover .strip{position:absolute;left:60px;right:60px;bottom:92px;display:grid;grid-template-columns:repeat(5,1fr);gap:18px}
.cover .strip div{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:12px;padding:10px 10px 12px;text-align:center}
.cover .strip span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* tese */
.quote{font-family:var(--serif);font-size:46px;line-height:1.12;color:var(--ink)}
.quote em{color:var(--gold);font-style:normal}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 30px}
.facts div{border-top:2px solid var(--opp);padding-top:10px}
.facts b{display:block;font-family:var(--serif);font-weight:400;font-size:40px;color:var(--ink)}
.facts span{font-size:14px;color:var(--muted)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.list{list-style:none}
.list li{padding:8px 0 8px 30px;position:relative;border-bottom:1px solid var(--line);font-size:16px}
.list li:last-child{border-bottom:0}
.list.yes li::before{content:"✓";position:absolute;left:4px;color:var(--f3);font-weight:700}
.list.no li::before{content:"✕";position:absolute;left:4px;color:var(--f4);font-weight:700}

/* fases */
.stairs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;align-items:end;height:500px}
.step{border-radius:14px;padding:22px;position:relative;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column}
.step .n{font-family:var(--serif);font-size:72px;line-height:.9}
.step h3{margin:8px 0 10px}
.step p{font-size:15.5px}
.step .day{margin-top:auto;padding-top:14px}
.step::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;border-radius:14px 14px 0 0;background:var(--c)}
.arrow-note{margin-top:22px;font-size:16px;color:var(--muted)}
.arrow-note b{color:var(--ink)}

/* semana */
.days{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.day-col{border-radius:14px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.day-col .hd{padding:18px 20px;background:var(--c);color:#0d0e11}
.day-col .hd b{font-family:var(--serif);font-weight:400;font-size:34px;display:block;line-height:1}
.day-col .hd span{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:600}
.day-col .bd{padding:16px 20px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv span{color:var(--muted)}
.kv b{font-weight:600;text-align:right}
.weekstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:22px}
.weekstrip div{border-radius:10px;padding:10px 8px;text-align:center;font-size:12px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.weekstrip div b{display:block;font-size:14px;color:var(--ink);margin-bottom:2px}
.weekstrip .jj{color:#0d0e11;border:0}
.weekstrip .jj b{color:#0d0e11}

/* calendário */
.cal{display:grid;grid-template-columns:230px repeat(7,1fr);gap:6px}
.cal .h{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .wk{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;height:84px}
.cal .wk b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.05}
.cal .wk span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cal .c{height:84px;border-radius:10px;background:var(--panel);border:1px solid var(--line);padding:7px 9px;position:relative;font-size:11.5px;color:var(--muted);display:flex;flex-direction:column}
.cal .c .d{font-size:13px;color:var(--dim);font-weight:600}
.cal .c .lbl{margin-top:auto;font-size:11px;letter-spacing:.08em;text-transform:uppercase}
.cal .c.jj{border:0;color:#0d0e11}
.cal .c.jj .d{color:rgba(0,0,0,.55)}
.cal .c.jj .lbl{font-weight:700}
.cal .c.jj .kit{position:absolute;top:7px;right:8px;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;background:rgba(0,0,0,.18);padding:2px 6px;border-radius:99px}
.cal .c.today{outline:2px solid var(--gold);outline-offset:-2px}
.cal .c .hol{color:var(--gold);font-size:10px;letter-spacing:.08em;text-transform:uppercase}
.cal .c.ter,.weekstrip .ter{background:var(--f1)}
.cal .c.qui,.weekstrip .qui{background:linear-gradient(135deg,var(--f2) 0 50%,var(--f3) 50% 100%)}
.cal .c.sex,.weekstrip .sex{background:var(--f4)}
.cal .c.prova{background:var(--gold)}
.legend{display:flex;gap:22px;margin-top:14px;font-size:13px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px}

/* cards das semanas */
.wks{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.wkc{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;height:590px;display:flex;flex-direction:column}
.wkc .top{display:flex;justify-content:space-between;align-items:baseline}
.wkc .top span{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.wkc .top em{font-style:normal;font-size:12px;color:var(--muted)}
.wkc h3{font-size:30px;margin:6px 0 4px}
.wkc .fig{background:radial-gradient(closest-side,#20232b,transparent);border-radius:12px;margin:2px 0 8px;display:flex;justify-content:center}
.chain{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.chain .s{border-radius:9px;padding:8px 11px;font-size:14px;line-height:1.35;background:var(--panel2);border-left:4px solid var(--f1)}
.chain .s b{display:block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chain .x{font-size:11.5px;color:var(--f4);letter-spacing:.06em;padding-left:12px}
.chain .s.dest{border-left-color:var(--f2)}
.mini{display:flex;flex-direction:column;gap:6px;margin-top:auto}
.mini div{font-size:13.5px;line-height:1.35;padding:7px 0 0;border-top:1px solid var(--line)}
.mini b{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:block;font-weight:600}
.mini .q b{color:var(--f3)} .mini .s6 b{color:var(--f4)}

/* aula */
.tl{display:grid;grid-template-columns:150px 1fr 150px;gap:16px;align-items:center;margin-bottom:22px}
.tl .who b{font-family:var(--serif);font-weight:400;font-size:28px;display:block;line-height:1}
.tl .who span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.bar{display:flex;height:96px;border-radius:12px;overflow:hidden;gap:3px}
.seg{padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between;font-size:12.5px;line-height:1.3}
.seg b{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase}
.seg i{font-style:normal;font-size:11px;opacity:.7}
.s-mob{flex:10;background:#2b303a;color:#cfd6e3}
.s-tec{flex:15;background:#2f3a55;color:#dfe7ff}
.s-dri{flex:15;background:#3d3350;color:#eadfff}
.s-rol{flex:15;background:#5a2233;color:#ffdbe3}
.s-deb{flex:5;background:#4a3d1e;color:#f6e3b4}
.gauge{height:10px;border-radius:99px;background:var(--panel2);position:relative;border:1px solid var(--line)}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:linear-gradient(90deg,#2f3a55,var(--gold))}
.gauge-l{font-size:12px;color:var(--muted);margin-top:6px}
.gauge-l b{color:var(--ink)}

/* placar */
.score{width:100%;border-collapse:separate;border-spacing:0 6px}
.score th{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:0 10px}
.score td{background:var(--panel);padding:9px 10px;font-size:14px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.score td:first-child{border-left:1px solid var(--line);border-radius:9px 0 0 9px}
.score td:last-child{border-right:1px solid var(--line);border-radius:0 9px 9px 0}
.score .blank{color:var(--dim);letter-spacing:.1em;font-variant-numeric:tabular-nums}
.score .pos{font-family:var(--serif);font-size:17px}
.big46{font-family:var(--serif);font-size:120px;line-height:.9;color:var(--gold)}

/* segurança */
.rules{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rule{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.rule b{display:block;font-size:15.5px;margin-bottom:3px}
.rule p{font-size:14px;line-height:1.4;color:var(--muted)}
.ask{counter-reset:a;list-style:none}
.ask li{counter-increment:a;padding:11px 0 11px 46px;position:relative;border-bottom:1px solid var(--line);font-size:16px}
.ask li::before{content:counter(a);position:absolute;left:0;top:9px;width:30px;height:30px;border-radius:99px;background:var(--opp);color:#fff;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}

/* celular: os slides deixam de ser 1280×800 e viram coluna rolável */
@media screen and (max-width:820px){
  body{padding:12px 0}
  .deck{zoom:1;width:auto;padding:0 10px;gap:14px}
  .slide{width:auto;height:auto;padding:28px 18px 58px;border-radius:12px}
  .sf{left:18px;right:18px;bottom:18px;font-size:10px;gap:12px}
  h1{font-size:62px} h2{font-size:31px;margin-bottom:18px} h3{font-size:22px}
  p,li{font-size:15.5px}
  .quote{font-size:29px}
  .cover .strip{position:static;margin-top:30px;grid-template-columns:repeat(3,1fr);gap:10px}
  .facts{grid-template-columns:1fr 1fr;margin:22px 0}
  .facts b{font-size:30px}
  .cols2,.days,.wks,.rules{grid-template-columns:1fr}
  .row{flex-direction:column}
  .row>*{width:auto!important}
  .stairs{grid-template-columns:1fr;height:auto}
  .step{height:auto!important}
  .step .n{font-size:52px}
  .weekstrip{grid-template-columns:repeat(4,1fr)}
  .wkc{height:auto}
  /* calendário: no celular só os dias de JJ (Ter · Qui · Sex) */
  .cal>:nth-child(8n+2),.cal>:nth-child(8n+4),.cal>:nth-child(8n+7),.cal>:nth-child(8n){display:none}
  .cal{grid-template-columns:92px repeat(3,1fr)}
  .cal .wk{flex-direction:column;justify-content:center;gap:2px;padding:6px;height:92px;text-align:center}
  .cal .wk svg{width:44px;height:36px}
  .cal .wk b{font-size:15px}
  .cal .wk span{font-size:9.5px}
  .cal .c{height:92px;padding:6px 7px}
  .cal .c.jj .kit{position:static;align-self:flex-start;margin-top:3px;font-size:9px;padding:1px 5px}
  .cal .c .lbl{font-size:9.5px;letter-spacing:.04em}
  .cover .strip span{font-size:10px;letter-spacing:.06em}
  .legend{flex-wrap:wrap;gap:10px 16px}
  .legend span:last-child{margin-left:0}
  .tl{grid-template-columns:1fr;gap:10px}
  .bar{flex-direction:column;height:auto}
  .seg{flex-direction:row;align-items:baseline;gap:10px;padding:9px 12px}
  .seg b{min-width:108px}
  .seg i{margin-left:auto}
  .big46{font-size:88px}
  .score td,.score th{padding:8px 6px;font-size:12.5px}
  .score .pos{font-size:15px}
  .score .blank{letter-spacing:0}
  .score th:last-child,.score td:last-child{display:none}
  .score td:nth-child(5){border-right:1px solid var(--line);border-radius:0 9px 9px 0}
  .card{flex-wrap:wrap}
}

@media print{
  @page{size:1280px 800px;margin:0}
  html,body{background:var(--bg);padding:0}
  .deck{zoom:1;gap:0}
  .slide{border-radius:0;break-after:page;-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
<style>
:root{--s-2:8px;--s-3:12px;--s-4:16px;--s-5:20px;--s-6:24px;--s-7:32px;--bg-sidebar:#16181d;--border:#2a2e36;--accent-dim:rgba(217,164,65,.12);--text-dim:#9b968d;--font:var(--sans);--text-main:#f2ede5;--bg-main:#0d0e11;--accent:#d9a441;--accent-text:#0d0e11;--error:#d8445e}
#ap-gate{min-height:80vh}
</style>
</head>

</div>

<style>
  .ap-gate-wrap { display: block; width: 100%; }
  #ap-gate { display:flex; align-items:center; justify-content:center; padding: var(--s-7) var(--s-5); background: radial-gradient(ellipse at center, rgba(91,103,91,0.06) 0%, transparent 60%); }

  .ap-gate-title { font-family: var(--font); font-weight: 600; font-size: 1.5em; color: var(--text-main); margin: 0 0 var(--s-2); line-height: 1.3; }
  .ap-gate-lead { color: var(--text-dim); font-size: 13px; margin: 0 0 var(--s-5); line-height: 1.6; }
  .ap-gate-card label { display:block; color: var(--text-dim); font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 6px; font-family: var(--font); }
  #ap-gate-input { width:100%; padding: 10px 12px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 4px; color: var(--text-main); font: inherit; font-size: 14px; outline: none; transition: border-color 0.15s; }
  #ap-gate-input:focus { border-color: var(--accent); }
  .ap-gate-card button { width:100%; margin-top: var(--s-3); padding: 10px; background: var(--accent); color: var(--accent-text); border: 1px solid var(--accent); border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; letter-spacing: 0.06em; font-family: var(--font); transition: background 0.15s; font-size: 12px; }
  .ap-gate-card button:hover { background: #6d796d; }

  .ap-gate-footnote .prompt::before { content: "$ "; color: var(--accent); }
</style>

  const SALT_B64 = "Y+MdN2MGEMTcF0dHKmEHfQ==";
  const IV_B64 = "F5JLYVIV3ab9yaBT";
  // KEY de localStorage é POR BU — senha de uma BU não destrava outra (isolamento multi-tenant).
  // gobbi é injetado pelo render-artifact ao gerar o HTML. Default cai em "wiki" pra páginas
  // que ainda não passam BU explícita (compat). Para gate de artefato, sempre tem BU.
  const STORAGE_KEY = "wikia-master-key-gobbi";

  const gate = document.getElementById('ap-gate');
  const mount = document.getElementById('ap-content-mount');
  const form = document.getElementById('ap-gate-form');
  const input = document.getElementById('ap-gate-input');
  const err = document.getElementById('ap-gate-err');

  function b64(s) { const b = atob(s); const o = new Uint8Array(b.length); for (let i=0;i<b.length;i++) o[i] = b.charCodeAt(i); return o; }

  async function deriveKey(pwd, salt) {
    const baseKey = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
      baseKey, { name: 'AES-GCM', length: 256 }, false, ['decrypt']
    );
  }

  async function tryUnlock(pwd) {
    try {
      const salt = b64(SALT_B64), iv = b64(IV_B64), cipher = b64(ENCRYPTED_PAYLOAD);
      const key = await deriveKey(pwd, salt);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, cipher);
      const decrypted = new TextDecoder().decode(plain);
      mount.innerHTML = decrypted;
      mount.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) s.src = old.src; else s.textContent = old.textContent;
        old.replaceWith(s);
      });
      gate.style.display = 'none';
      mount.style.display = 'block';
      // localStorage — persiste cross-page e cross-session
      localStorage.setItem(STORAGE_KEY, pwd);
      // Notifica componentes (mermaid-zoom, comparator, accordion-seq) que conteúdo
      // criptografado foi injetado no DOM e podem (re)inicializar.
      document.dispatchEvent(new CustomEvent('wikia:unlocked', { detail: { html: decrypted } }));
      return true;
    } catch (e) { return false; }
  }

  // Auto-unlock: se já tem chave salva no localStorage, tenta
  const saved = localStorage.getItem(STORAGE_KEY);
  if (saved) {
    tryUnlock(saved).then(ok => { if (!ok) localStorage.removeItem(STORAGE_KEY); });
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const ok = await tryUnlock(input.value);
    if (!ok) { err.textContent = '✗ senha incorreta'; input.value = ''; input.focus(); }
  });
})();
